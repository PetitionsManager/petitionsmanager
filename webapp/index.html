<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Startwerte; app.js zieht das je nach gewaehltem Design nach. -->
<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)">
<title>PetitionsManager</title>

<!-- PWA / installierbar auf Android & iOS ("Zum Home-Bildschirm") -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Beschriftung des Startsymbols auf iOS. Bewusst der Eigenname und
     nicht "Petitionen" (Nutzerentscheidung 8.8.2026): das Webmanifest ist
     statisch, es gibt keinen Weg, es sprachabhaengig zu machen - ein Wert
     muss fuer alle Sprachen passen. Dass Android und iOS lange Namen auf
     dem Startbildschirm kuerzen, ist dabei in Kauf genommen. -->
<meta name="apple-mobile-web-app-title" content="PetitionsManager">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="fontawesome/css/all.min.css">
<link rel="stylesheet" href="style.css">
<!-- Dark Mode: haengt an <html data-theme="light|dark|auto"> -->
<link rel="stylesheet" href="theme.css">
<!-- Layout: haengt an <html data-layout="relief|magazin"> („klassisch" ist
     seit v27 entfernt; loadPrefs schreibt alte Werte auf „relief" um).
     Muss NACH theme.css stehen (siehe Kopfkommentar in layouts.css). -->
<link rel="stylesheet" href="layouts.css">
</head>
<body>
<!-- ⚠️ SPRACHE (8.8.2026): Alle deutschen Worte in diesem Dokument sind nur
     der RÜCKFALL. Diese Datei wird geladen, bevor es texts.js oder app.js
     gibt, und kann T() deshalb nicht aufrufen; app.js überschreibt sie beim
     Start und nach jedem Sprachwechsel (setzeRahmenTexte(), gerufen aus
     applyLayout()). Die Texte selbst stehen in texts.js unter „shell".
     Wer hier ein Wort ändert, ändert es dort mit — sonst springt die
     Beschriftung beim Start um. Neue sichtbare Texte in dieser Datei
     brauchen einen Schlüssel und eine Zeile in setzeRahmenTexte(). -->
<div class="app">

  <!-- Kopfleiste: traegt jetzt die Wortmarke statt des Seitentitels.
       Das Zeichen ist Inline-SVG — keine zusaetzliche Datei, kein Nachladen,
       und es faerbt sich ueber Klassen aus den Theme-Variablen (siehe
       style.css, Abschnitt „Wortmarke"). Als fill="…"-Attribut geschrieben
       liefe der Dark Mode daran vorbei. -->
  <header class="topbar">
    <!-- Als <button>, nicht als <div> mit Klick-Zuhoerer: nur so ist die
         Wortmarke per Tabulator erreichbar und wird als Bedienelement
         angesagt. Fuehrt zurueck zur Uebersicht (app.js → goHome). -->
    <button class="brand" type="button" id="brandhome"
            aria-label="Zur Übersicht">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"
           focusable="false">
        <rect class="bm-badge" x="0" y="0" width="32" height="32" rx="9"/>
        <path class="bm-check" d="M9.5 14.2l4.2 4.2L23 9.2" fill="none"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect class="bm-line" x="9" y="21" width="14" height="2.2" rx="1.1"/>
      </svg>
      <span class="brand__txt">
        <span class="brand__name">Petitions<span
          class="brand__name2">Manager</span></span>
        <span class="brand__beta">Beta</span>
      </span>
    </button>

    <!-- Fehler melden. Sitzt rechts oben, weil die Kopfleiste dort ohnehin
         frei ist (space-between mit bisher nur einem Kind) und weil der Weg
         aus JEDER Ansicht erreichbar sein soll — die Melde-Knoepfe im
         Abschnitt „Unterstuetzen" stehen nur auf der Uebersicht, ganz unten.
         Die vollstaendige Aufforderung steht in title und aria-label;
         sichtbar waere der ganze Satz in einer Kopfleiste zu lang.
         Kein eigenes Formular: die App hat bewusst keinen Server, ein
         Formular braeuchte einen (app.js → reportbug). -->
    <button class="reportbtn" type="button" id="reportbug"
            title="Fehler gefunden? Bitte melden!"
            aria-label="Fehler gefunden? Bitte melden">
      <i class="fa-solid fa-bug" aria-hidden="true"></i>
      <span class="reportbtn__t">Fehler melden</span>
    </button>
  </header>

  <!-- Seitentitel. Stand frueher in der Kopfleiste; dort sitzt jetzt die
       Wortmarke. Bewusst AUSSERHALB von #content, weil app.js dessen Inhalt
       bei jedem Rendern komplett neu schreibt und das Element sonst jedes Mal
       verloren ginge. -->
  <div class="pagekick" id="pagekick"></div>

  <!-- Inhaltsbereich (Tabs werden hier hineingerendert) -->
  <main class="content" id="content"></main>

  <!-- Footer-Navigation -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="liste" aria-label="Liste">
      <i class="fa-solid fa-list"></i><span>Liste</span>
    </button>
    <button class="tab" data-tab="einstellungen" aria-label="Einstellungen">
      <i class="fa-solid fa-gear"></i><span>Einstellungen</span>
    </button>
    <button class="tab" data-tab="profil" aria-label="Profil">
      <i class="fa-solid fa-user"></i><span>Profil</span>
    </button>
  </nav>

  <!-- Offline-Hinweis. Liegt ueber der Fussleiste am unteren Rand, weil die
       Meldung waehrend des Lesens gelten muss und nicht nur beim Seitenaufruf.
       Wegklickbar: wer es gelesen hat, soll weiterlesen koennen. Beim naechsten
       Wechsel des Verbindungszustands kommt er von selbst wieder (app.js →
       setzeOnline). Steht hier statt in #content, weil app.js dessen Inhalt bei
       jedem Rendern neu schreibt. -->
  <div class="offbar" id="offbar" hidden role="status">
    <i class="fa-solid fa-plug-circle-xmark" aria-hidden="true"></i>
    <span class="offbar__t">Kein Internet. Du siehst gespeicherte Daten –
      Bilder und Aktualisierungen fehlen.</span>
    <button class="offbar__x" type="button" id="offbarx"
            aria-label="Hinweis schließen">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Nach-oben-Button (erscheint nach dem Scrollen) -->
  <button class="to-top" id="to-top" type="button" aria-label="Nach oben">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

</div>
<!-- Texte und Plattform-Stammdaten liegen getrennt vom Programmcode und
     muessen VOR app.js geladen werden. -->
<script src="texts.js"></script>
<script src="platforms.js"></script>
<script src="app.js"></script>
</body>
</html>
