<!-- foodwatch - Wort- und Bildmarke, Inline-SVG aus dem Kopf von
     https://www.foodwatch.org/de/ (geprueft 2026-07-29 in Chrome).
     Geometrie und viewBox sind unveraendert das Original; nur die Fuellungen
     sind hier zugeordnet.

     Das Logo ist DREIfarbig. Vorher trugen alle sieben Pfade currentColor,
     weil die Datei als einfarbige CSS-Maske lief - damit fiel die Zweifarbigkeit
     weg. Die Reihenfolge der Pfade wurde ueber die Laenge der d-Attribute mit
     dem Original abgeglichen (493, 1938, 1351, 110, 224, 203, 262 Zeichen,
     alle sieben identisch), die Zuordnung ist also belegt und nicht geraten:

       Pfad 0, 2, 4, 6   im Original #1d1d1b  -> hier currentColor
       Pfad 1, 5         im Original #f7a600  -> bleibt Orange
       Pfad 3            im Original #fff     -> bleibt Weiss

     Warum currentColor statt #1d1d1b: foodwatch setzt diesen Teil selbst je
     Hintergrund um. Auf der Website steht "watch" schwarz, im eigenen
     Kontrollreport (2026-06-24, vom Nutzer belegt) steht es WEISS auf Violett,
     waehrend "food" und der Apfel orange bleiben. currentColor bildet genau das
     nach: die Schriftfarbe der Umgebung traegt den anpassungsfaehigen Teil, das
     Orange bleibt fest.
     Im Druckstueck ist das Orange uebrigens #FAB50A statt #f7a600 - der
     uebliche CMYK-Unterschied. Fuer die App gilt der Webwert.

     Farbrollen - ausfuehrlich in style.css, Abschnitt "Eingebettete Marke":
     Markenformen tragen jetzt BEIDES, fill="#f7a600" und
     style="fill:var(pl-b1, #f7a600)" (die Variable im Quelltext mit zwei
     Bindestrichen davor, die hier im Kommentar nicht stehen duerfen). Das
     feste Hex haelt die Datei fuer sich betrachtet richtig; die Variable
     laesst die App im dunklen Thema den aufgehellten Ton einsetzen.
     currentColor bleibt der adaptive Teil und folgt der Schriftfarbe. -->
