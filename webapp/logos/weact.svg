<!-- WeAct - Wortmarke, aus dem Original herausgeloest.
     Quelle: Inline-SVG im Shadow DOM von cmpr-logo-weact auf
     https://weact.campact.de (geprueft 2026-07-29 in Chrome; normale
     Selektoren finden es NICHT, man muss die Schattenbaeume durchlaufen).

     Das Original ist ein Schild: ein Rechteck in #E9005F ueber die ganze
     Flaeche (viewBox 0 0 200 158, Verhaeltnis 1,266) mit der Wortmarke WEISS
     ausgespart. Hier liegt nur der Wortmarken-Pfad, wortgleich (1704 Zeichen),
     die viewBox eng darauf: 23.34 27.22 147.79 103.84, Verhaeltnis 1,423 -
     dieser Wert steht als logoAR in platforms.js und ist richtig.

     Warum nicht das Schild: die zehn anderen Logos stehen alle ohne
     Hintergrundplatte, und eine gefuellte Flaeche verstiesse im Layout
     "relief" gegen Gesetz 5 (Farbe nur in Schrift, Symbol und Logo, nie in
     einer Flaeche). Wer das Schild doch will, nimmt die viewBox 0 0 200 158,
     setzt das Rechteck M200 0H0V157.219H200V0Z in #E9005F davor und faerbt
     diesen Pfad weiss.

     Farbrollen - ausfuehrlich in style.css, Abschnitt "Eingebettete Marke":
     Markenformen tragen jetzt BEIDES, fill="#e9005f" und
     style="fill:var(pl-b1, #e9005f)" (die Variable im Quelltext mit zwei
     Bindestrichen davor, die hier im Kommentar nicht stehen duerfen). Das
     feste Hex haelt die Datei fuer sich betrachtet richtig; die Variable
     laesst die App im dunklen Thema den aufgehellten Ton einsetzen.
     currentColor bleibt der adaptive Teil und folgt der Schriftfarbe. -->
