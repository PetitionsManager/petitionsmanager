<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 360">
  <!-- Markenzeichen von innn.it: die durchgehende Welle, die die drei "n" des
       Namens bildet. Aus dem eigenen Buendel der Plattform uebernommen
       (innn.it/_next/static/chunks/pages/_app-*.js, dort als Hero-Grafik mit
       Farbverlauf hinterlegt) - also die echte Vektorform der Marke und keine
       Nachzeichnung von mir.

       Vorgeschichte, damit der Fehler nicht wiederkehrt: hier lag vorher ein
       in SVG gewickeltes Base64-PNG, und das war doppelt falsch. Erstens war
       die Datei nur ein AUSSCHNITT (123x165 Pixel; sichtbar ein Punkt und ein
       einzelner Bogen), nicht die Marke. Zweitens hatte ich den viewBox auf
       123x86 beschnitten, weil ich glaubte, der Browser zeichne nur die obere
       Haelfte - damit fehlten die Zeilen 86 bis 165, also gerade der dichteste
       Teil. Nachgemessen habe ich erst hinterher: das PNG hatte einen
       einwandfreien Alphakanal (31 % deckend, 65 % transparent), taugte als
       Maske also grundsaetzlich. Es zeigte nur das Falsche. Die Lehre ist,
       die gezeichnete FLAECHE zu pruefen und nicht bloss, ob die Datei laedt.

       Der Pfad ist bewusst einfarbig gefuellt. Als CSS-Maske zaehlt allein der
       Alphakanal; die Farbe kommt aus background-color (siehe .plogo in
       style.css). Ein Farbverlauf wie im Original wuerde in der Maske zu
       Deckungsgrad verrechnet und die Form verwaschen. -->
