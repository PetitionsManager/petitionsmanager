<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 123 86">
  <!-- App-Symbol von innn.it. Die Plattform veroeffentlicht keine
       Wortmarke (Startseite ist eine React-Anwendung, im Buendel steht
       kein Logo-SVG) - hier liegt deshalb das 192er-Icon eingebettet.
       Warum in einer SVG-Huelle statt direkt als PNG: als CSS-Maske war
       das PNG das einzige Rasterbild unter zehn SVGs und wurde nicht
       gezeichnet. Die Huelle macht die Quelle gleichartig.
       Die viewBox ist auf 123x86 beschnitten, NICHT auf die vollen 123x165
       der Datei: unterhalb davon zeichnet der Browser nichts (im Canvas
       nachgemessen), obwohl PIL dort noch Alphawerte meldet. Ohne den
       Beschnitt haette die Marke die halbe Kastenhoehe leer gelassen. -->
  <image width="123" height="165" xlink:href="data:image/png;base64,"/>
</svg>
