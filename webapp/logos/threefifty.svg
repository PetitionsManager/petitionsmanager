<?xml version="1.0" encoding="utf-8"?> <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"> <!-- 350.org - Wortmarke "350.org" mit dem Pfeil, Inline-SVG der Plattform.
     Geprueft 2026-07-29: im Kopf von https://350.org steht dasselbe Zeichen,
     dort weiss auf dunklem Foto (dessen viewBox ist 0 0 251.3 108.7, eine
     andere Beschneidung - unsere ist eng um die Tinte gelegt, Verhaeltnis
     2,666, und passt zu logoAR in platforms.js).

     Entfernt wurde eine per display:none unsichtbare ZWEITFASSUNG des ganzen
     Logos: die Gruppe <g id="Layer_2" class="st2">, darin
     <g id="_x33_50-logo-white"> - also die Weiss-Variante der Marke.
     Der Browser hat sie richtig verborgen (ein Elternteil mit display:none
     rendert seine Kinder nie, das .st3{display:inline} darin kann das nicht
     aufheben); sichtbar war immer nur die erste Fassung. Werkzeuge, die
     display ignorieren - etwa ImageMagick - zeichneten aber beide
     uebereinander und zeigten ein scheinbar zerstoertes Logo. Genau das hat
     mich beim Pruefen fast in die Irre gefuehrt.
     Die Weiss-Variante braucht die App nicht: die Fuellung ist currentColor
     und dreht sich mit dem Thema von selbst.

     350.org fuehrt das Zeichen selbst je Hintergrund in Schwarz oder Weiss und
     hat dafuer keine eigene Hausfarbe. Der Farbwert in platforms.js gilt nur
     fuer die Markenkachel im Magazin-Layout.

     Der Block style ist aufgeloest: der Marken-Bogen in app.js uebernimmt
     keine Formatvorlagen aus den Dateien, sonst kaemen elf Dateien mit
     denselben Kurznamen (st0, st1 ...) in EIN Dokument. Aus .st0 wurde
     fill="currentColor", aus .st1 zusaetzlich opacity="0.65". Die Klassen
     bleiben als Herkunftsspur stehen. Diese Marke hat keine eigene
     Hausfarbe und laeuft ganz ueber currentColor. -->
