plugins {
    id 'com.android.application'
}

android {
    namespace 'app.petitionsmanager'
    compileSdk 34

    // FESTER SIGNATURSCHLUESSEL (8.8.2026) — der Grund, warum es ihn gibt:
    // Ohne eigene signingConfig erzeugt Gradle sich beim Bauen selbst einen
    // Debug-Schluessel unter ~/.android/debug.keystore. Auf einem GitHub-Runner
    // ist das jedes Mal eine frische Maschine, also war JEDE APK anders
    // signiert. Android hielt sie deshalb fuer eine fremde App mit demselben
    // Namen und verweigerte das Ueberinstallieren:
    // "Das Paket steht in einem Konflikt mit einem bestehenden Paket."
    // Der Nutzer musste vor jeder neuen Fassung deinstallieren und verlor
    // dabei Merkliste und Einstellungen.
    //
    // ⚠️ ZWEITER ANLAUF, GEHEIM STATT IM REPO. Der erste Versuch legte
    // debug.p12 offen ins Repo — fuer einen reinen Debug-Schluessel vertretbar,
    // aber der Nutzer will spaeter in Google Play und F-Droid. Ein Schluessel,
    // der je oeffentlich war, ist dafuer verbrannt: jeder koennte Pakete
    // bauen, die sich als diese App ausgeben. Deshalb liegt er jetzt als
    // GitHub-Secret (SIGNING_KEYSTORE_BASE64), der Workflow schreibt ihn zur
    // Bauzeit nach android/app/signing.p12, und dieser Pfad steht in
    // .gitignore. Der alte debug.p12 ist entfernt und gilt als kompromittiert.
    //
    // Faellt das Secret weg (Fork, lokaler Bau), greift KEIN Ersatzschluessel:
    // ein automatisch erzeugter waere wieder bei jedem Lauf ein anderer und
    // brächte genau das Problem zurueck, das hier geloest wird. Stattdessen
    // bleibt signingConfig null — Gradle nimmt dann seinen eigenen
    // Debug-Schluessel, was fuer einen lokalen Testbau richtig ist, und der
    // Workflow warnt ausdruecklich davor.
    //
    // Erzeugt mit openssl (RSA 4096, selbstsigniert, gueltig bis 2061) — auf
    // dem Entwicklungsrechner gibt es kein keytool, aber Java 17 liest PKCS12
    // nativ.
    def ksDatei    = file('signing.p12')
    def ksPasswort = System.getenv("SIGNING_KEYSTORE_PASSWORD")
    def ksDa       = ksDatei.exists() && ksPasswort
    signingConfigs {
        debug {
            if (ksDa) {
                storeFile ksDatei
                storeType 'PKCS12'
                storePassword ksPasswort
                keyAlias 'petitionsmanager'
                keyPassword ksPasswort
            }
        }
    }

    defaultConfig {
        applicationId "app.petitionsmanager"
        minSdk 24
        targetSdk 34
        // versionCode zaehlt mit der Nummer des Bau-Laufs hoch (im Workflow als
        // VERSION_CODE gesetzt). Vorher stand hier dauerhaft 1: in den
        // App-Infos war dadurch nie zu erkennen, welcher Stand installiert ist,
        // und Android sah in einer neuen APK kein Update. Ohne die Variable
        // (lokaler Bau) bleibt es bei 1.
        // ⚠️ ZUWEISUNG MIT "=", NICHT die Kurzform ohne Gleichheitszeichen.
        // Der erste Anlauf am 8.8.2026 stand hier als
        //     versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        // und hat den Bau nach 50 Sekunden in der KONFIGURATIONSPHASE
        // getoetet. Groovy liest ein Leerzeichen vor der Klammer als
        // Methodenaufruf: aus dem Ausdruck wird versionCode("1").toInteger()
        // - also versionCode mit einem STRING aufgerufen und .toInteger()
        // auf dessen Rueckgabewert. Mit "=" ist es eindeutig eine Zuweisung.
        // Merke: in build.gradle jede berechnete Eigenschaft mit "=" setzen,
        // die Kurzform nur fuer schlichte Literale.
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("VERSION_NAME") ?: "1.0"
    }

    // Die komplette Web-App (inkl. webapp/data/*.json) wird als Asset gebündelt.
    // Einzige Quelle der Wahrheit ist der Ordner ../../webapp – nach jedem
    // `python3 publish.py` sind die Daten in der nächsten APK automatisch aktuell.
    sourceSets {
        main {
            assets.srcDirs += ['../../webapp']
        }
    }

    buildTypes {
        // AGP nimmt fuer den Debug-Typ zwar automatisch signingConfigs.debug,
        // aber ausgeschrieben ist es eindeutig: hier haengt die Frage dran, ob
        // sich die APK ueberinstallieren laesst. Das soll niemand suchen muessen.
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // JSON ist bereits Text; erneutes Komprimieren beim Packen bringt wenig,
    // aber wir lassen die Standardkomprimierung des APK aktiv (kleinere Datei).
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
