name: Checks

# Schnelle Grundprüfung bei jedem Push. Grund: ein Syntaxfehler in webapp/app.js
# fällt sonst erst auf dem Handy auf – die App zeigt dann einen weißen
# Bildschirm, und der APK-Build hätte ihn klaglos mitgebaut.
on:
  push:
  pull_request:
  workflow_dispatch:

# Reine Pruefung – der Token braucht nur Lesezugriff. Ohne diesen Block erbt er
# die Repo-Voreinstellung, die auch Schreibrechte umfassen kann.
permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '20'

      - name: JavaScript der App prüfen
        run: |
          for f in webapp/*.js; do
            echo "prüfe $f"
            node --check "$f"
          done

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Python-Dateien übersetzen
        run: python3 -m compileall -q *.py

      # Bis 29.8.2026 kam Checks ohne Abhängigkeiten aus (compileall importiert
      # nicht). Der Selbsttest darunter importiert petitions_core wirklich und
      # braucht deshalb requests/bs4. Aus requirements.txt, damit hier keine
      # zweite, abweichende Fassung der Versionen entsteht.
      - name: Abhängigkeiten für den Selbsttest
        run: pip install -r requirements.txt

      # Prüft die Wächter mit Kunstdaten: die Massen-Lösch-Bremse und die
      # Startdatum-Prüfung. Beide sollen im Betrieb möglichst nie auslösen —
      # genau deshalb sagt ein grüner Nachtlauf nichts über sie aus.
      - name: Selbsttest der Wächter
        run: python3 selbsttest.py

      # ⚠️⚠️ Hier stand bis 17.9.2026 der Schritt "App-Daten als JSON
      # validieren". Er war seit dem 7.8.2026 WIRKUNGSLOS: seit webapp/data in
      # .gitignore steht (Zeile 31), liegen im HEAD null Dateien darunter, und
      # kein Schritt davor erzeugt den Ordner. Der Prüfcode stieg deshalb bei
      # jedem Lauf sofort mit sys.exit(0) aus und setzte einen grünen Haken —
      # bei kaputten Daten hätte er genauso ausgesehen wie bei heilen.
      # Nachgemessen in einem frischen `git archive HEAD`-Checkout: Ausgabe
      # "webapp/data fehlt – übersprungen.", Exit 0.
      #
      # ➡️ Der Schritt ist nach scrape.yml gewandert, direkt hinter
      # "Web-App-Daten erzeugen". Dort liegt webapp/data frisch auf der Platte
      # (alle 41 Bestände aus dem Cache), die Prüfung kostet 1,5 s ohne einen
      # einzigen Netzabruf, und ein Befund fällt VOR dem Pages-Deploy auf.
      # Gegen den echten Live-Stand vom 17.9.2026 gelaufen meldet sie sofort
      # einen echten Mangel (foodwatch_fr führt eine URL doppelt).
      #
      # ❌ Zwei Wege, die Prüfung HIER zu retten, sind gemessen und verworfen:
      #   · hole_live_daten.py vorschalten: +13 s und koppelt jeden Push an die
      #     Verfügbarkeit von GitHub Pages. Das trägt die Ablehnung weiter.
      #     ⚠️ Der zusätzlich notierte Grund ist am 17.9.2026 ENTFALLEN:
      #     hole_live_daten.dateiliste() lud die 15 fremdsprachigen Volltext-
      #     pakete (<key>.<lg>.t<n>.json, 3,1 MB) nicht herunter, weil sie im
      #     Manifest unter "tvl" stehen und nicht unter "tv" — behoben, samt
      #     Selbsttest-Abschnitt 10. Mit dem nach scrape.yml gewanderten
      #     Prüfcode gegen den Live-Stand nachgemessen: OHNE die Pakete 1923
      #     Befunde, MIT ihnen genau 1 — die echte foodwatch_fr-Dublette.
      #     ⚠️ Die hier zuvor genannten "46 Phantom-Fehler" ließen sich dabei
      #     NICHT reproduzieren; wer die Zahl braucht, misst sie neu.
      #   · publish.py vorschalten: +45 s auf einen Lauf, der heute 20–26 s
      #     dauert, und 20 PHANTOM-Fehler, weil nur 21 der 41 Bestände im Repo
      #     liegen; publish.py schreibt dann ein Manifest mit 41 Live-
      #     Plattformen, aber nur 21 Listen.
      # Beide hätten nicht die Daten geprüft, sondern die Lücken des Prüfstands.

      - name: Texte und Plattform-Stammdaten auf Vollständigkeit prüfen
        run: |
          node -e '
            global.window = {};
            require("./webapp/texts.js");
            require("./webapp/platforms.js");
            const T = global.window.PM_TEXTS, P = global.window.PM_PLATFORMS;
            const fehlt = [];
            // texts.js traegt seit 8.8.2026 eine SPRACHEBENE: PM_TEXTS.de.app
            // statt PM_TEXTS.app. Geprueft wird deshalb jede Sprache einzeln -
            // und zusaetzlich, dass keine Uebersetzung Schluessel verliert:
            // eine unvollstaendige Sprache faellt in der App still auf Deutsch
            // zurueck, was beim Entwickeln erwuenscht ist, beim Ausliefern
            // aber unbemerkt bliebe.
            const ABSCHNITTE = ["app","wizard","liste","signed","platform",
                                "settings","notify","reset","profile","about"];
            const sprachen = Object.keys(T);
            if (!sprachen.length) fehlt.push("texts.js: keine Sprache gefunden");
            for (const s of sprachen)
              for (const k of ABSCHNITTE)
                if (!T[s][k]) fehlt.push(`texts.js [${s}]: Abschnitt ${k}`);
            // Schluesselvergleich gegen Deutsch als Bezugsgroesse
            const pfade = (o, p = "") => Object.entries(o).flatMap(([k, v]) =>
              (v && typeof v === "object" && !Array.isArray(v))
                ? pfade(v, p + k + ".") : [p + k]);
            if (T.de) {
              const soll = new Set(pfade(T.de));
              // ⚠️ GENAU EIN Schluessel ist ausgenommen: legal.impressumHtml.
              // Es ist eine Pflichtangabe mit echter Anschrift; eine zweite
              // Sprachfassung waere eine zweite Pflichtangabe, die
              // auseinanderlaufen kann. T() faellt dafuer auf Deutsch zurueck.
              //
              // Vorher stand hier k.startsWith("legal.") und nahm den ganzen
              // Abschnitt heraus - Kodex, Nutzungsrecht und die Anfrage-
              // staende inbegriffen. Die sind seit dem 8.8.2026 abends
              // uebersetzt (Nutzerentscheidung: alles ausser dem Impressum),
              // und die pauschale Ausnahme haette jede kuenftige Luecke im
              // Rechtsbereich stillschweigend durchgelassen - auch eine
              // versehentliche. Deshalb der Vergleich auf Gleichheit: was
              // nicht genau dieser eine Schluessel ist, muss uebersetzt sein.
              const einsprachig = (k) => k === "legal.impressumHtml";
              for (const s of sprachen.filter(x => x !== "de")) {
                const ist = new Set(pfade(T[s]));
                const weg = [...soll].filter(x => !ist.has(x) && !einsprachig(x));
                const nurDe = [...soll].filter(x => !ist.has(x) && einsprachig(x));
                if (nurDe.length)
                  console.log(`texts.js [${s}]: ${nurDe.length} Text bewusst nur auf Deutsch (${nurDe.join(", ")})`);
                const neu = [...ist].filter(x => !soll.has(x));
                if (weg.length) fehlt.push(`texts.js [${s}]: ${weg.length} Schluessel fehlen (${weg.slice(0,5).join(", ")}${weg.length>5?", …":""})`);
                if (neu.length) fehlt.push(`texts.js [${s}]: ${neu.length} unbekannte Schluessel (${neu.slice(0,5).join(", ")}${neu.length>5?", …":""})`);
              }
              console.log(`texts.js: ${sprachen.length} Sprachen, ${soll.size} Schluessel je Sprache`);
            }
            // Geprueft wird logoFile, NICHT mehr logo. Das Feld logo war ein
            // selbstgebautes Monogramm-Badge und ist am 29.7.26 entfallen,
            // seit alle elf Plattformen ihre echte Marke haben; diese Zeile
            // hat den Wegfall gemeldet, und das war richtig so.
            for (const [key, v] of Object.entries(P))
              for (const f of ["color","logoFile","about"])
                if (!v[f]) fehlt.push(`platforms.js: ${key}.${f}`);
            // Plattformname und "Fuer Nerds"-Satz kommen sonst aus dem
            // MANIFEST, das der Scraper erzeugt - also serverseitig und
            // einsprachig deutsch. In der englischen Oberflaeche stand
            // deshalb "Europaeisches Parlament" mitten im englischen Satz.
            // Der Uebersetzungsbaum ist ABSICHTLICH lueckenhaft (Marken wie
            // WeAct oder foodwatch heissen ueberall gleich), aber die
            // opennessNote muss jede Plattform haben: sie ist ein ganzer
            // deutscher Satz und faellt sonst als einziger Fremdkoerper auf.
            // Dasselbe gilt seit 30.8.2026 fuer opennessWunsch (der zweite
            // Satz im Nerd-Bereich: was die Plattform vorbildlich macht bzw.
            // welche Sperre fallen muesste). Ohne diese Pruefung faellt eine
            // fehlende Uebersetzung nicht auf — die App zeigt dann still den
            // deutschen Satz, und zwar nur englischen Nutzern.
            const PEN = global.window.PM_PLATFORMS_EN || {};
            for (const key of Object.keys(P)) {
              if (!(PEN[key] || {}).opennessNote)
                fehlt.push(`platforms.js: PM_PLATFORMS_EN.${key}.opennessNote`);
              if (!(PEN[key] || {}).opennessWunsch)
                fehlt.push(`platforms.js: PM_PLATFORMS_EN.${key}.opennessWunsch`);
            }
            // Ein Pfad, hinter dem keine Datei liegt, faellt sonst erst auf
            // dem Handy auf: die Marke bleibt dann einfach leer.
            const fs = require("fs");
            for (const [key, v] of Object.entries(P))
              if (v.logoFile && !fs.existsSync("webapp/" + v.logoFile))
                fehlt.push(`platforms.js: ${key}.logoFile zeigt auf `
                  + `${v.logoFile}, diese Datei fehlt`);
            if (fehlt.length) { console.error(fehlt.join("\n")); process.exit(1); }
            console.log(`texts.js und platforms.js vollständig `
              + `(${Object.keys(P).length} Plattformen)`);
          '

      # ⚠️ Seit 17.9.2026 steht jeder ENGLISCHE Offenheitssatz ZWEIMAL im Repo:
      # in platforms.js liest ihn die App, in openness_note_en das Dashboard
      # (petitions_core._openness_badge). Zwei Fassungen derselben Angabe laufen
      # auseinander, und man merkt es erst, wenn jemand die falsche liest — beim
      # Tooltip hiesse das: englische Nutzer sehen still den deutschen Satz.
      # Genau dieser Zustand lag bis dahin auf ALLEN 41 Kacheln vor, weil das
      # Feld openness_note_en gar nicht existierte und der Rueckfall griff.
      #
      # ⚠️⚠️ Warum das Dashboard platforms.js nicht einfach selbst liest (wie es
      # _app_steckbriefe() fuer den Steckbrief tut): nur 17 der 41 Schluessel
      # stehen dort flach, die anderen 24 erzeugt ein IIFE am Dateiende (5x
      # wemove, 17x avaaz, 2x foodwatch). Ein Regex kaeme daran nicht heran,
      # node schon — und im Scrape-Lauf gibt es kein node, hier aber sehr wohl.
      - name: Englische Offenheitstexte gegen platforms.js abgleichen
        run: |
          node -e '
            global.window = {};
            require("./webapp/platforms.js");
            const EN = global.window.PM_PLATFORMS_EN || {};
            const aus = {};
            for (const [k, v] of Object.entries(EN))
              if (v && v.opennessNote) aus[k] = v.opennessNote;
            require("fs").writeFileSync("/tmp/openness_en.json", JSON.stringify(aus));
            console.log(`platforms.js: ${Object.keys(aus).length} englische Offenheitstexte gelesen`);
          '
          python3 - <<'PY'
          import json
          import sys

          import monitor

          js = json.load(open("/tmp/openness_en.json", encoding="utf-8"))
          fehler, geprueft = [], 0
          for p in monitor.PLATFORMS:
              # Ohne Ampelstufe zeichnet _openness_badge() gar kein Badge, es
              # gibt also auch keinen Tooltip zu uebersetzen. Ein Platzhalter
              # ohne Bewertung darf die Pruefung deshalb nicht rot machen.
              if not 1 <= p.openness <= 5:
                  continue
              geprueft += 1
              soll, ist = js.get(p.key), p.openness_note_en
              if not ist:
                  fehler.append(f"{p.key}: openness_note_en fehlt im Scraper – "
                                f"der Tooltip faellt auf Deutsch zurueck")
              elif soll is None:
                  fehler.append(f"{p.key}: platforms.js fuehrt kein "
                                f"PM_PLATFORMS_EN.{p.key}.opennessNote")
              elif ist != soll:
                  fehler.append(f"{p.key}: die beiden Fassungen laufen auseinander\n"
                                f"      Scraper     : {ist}\n"
                                f"      platforms.js: {soll}")

          if fehler:
              print("Englische Offenheitstexte stimmen nicht ueberein:",
                    file=sys.stderr)
              for f in fehler:
                  print("  -", f, file=sys.stderr)
              print("\nBeide Orte muessen denselben Satz fuehren: den Scraper "
                    "(openness_note_en) UND webapp/platforms.js.", file=sys.stderr)
              sys.exit(1)
          print(f"Offenheitstexte: {geprueft} Plattformen, Scraper und "
                f"platforms.js wortgleich.")
          PY
