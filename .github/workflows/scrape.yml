name: Scrape & Publish

# Holt täglich frische Petitionsdaten und veröffentlicht sie über GitHub Pages.
# Der Scraper-Zustand (die *_petitions.json) lebt im Actions-Cache – so wächst
# das Repo NICHT mit jedem Lauf. Manuell startbar über "Run workflow".
on:
  schedule:
    - cron: '17 3 * * *'      # täglich 03:17 UTC
  workflow_dispatch:
    inputs:
      nacharbeit:
        description: 'Einmalige Nacharbeit mitlaufen lassen (Bundestag-Phasen 3+4, Avaaz-Archiv)'
        type: boolean
        default: false
      # Veröffentlicht den zuletzt gescrapten Stand aus dem Cache neu, ohne
      # eine einzige Quelle anzufassen: ~3 statt ~300 Minuten. Gedacht für
      # Änderungen, die nur die Web-App oder publish.py betreffen — sonst
      # müsste man auf den Nachtlauf warten, um sie live zu sehen.
      nur_veroeffentlichen:
        description: 'Nur veröffentlichen (nicht scrapen) – letzten Stand aus dem Cache neu ausliefern'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scrape-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: "Scraper-Zustand aus Cache holen (Fallback: Stand im Repo)"
        id: zustand
        uses: actions/cache/restore@v4
        with:
          # texts_index.json MUSS mitwandern: er hält fest, in welchem
          # Volltext-Paket eine Petition liegt. Geht er verloren, vergibt
          # publish.py die Nummern neu und jedes Gerät lädt alle Pakete
          # noch einmal (siehe publish.write_texts).
          path: |
            *_petitions.json
            texts_index.json
          key: petition-stores-${{ github.run_id }}
          restore-keys: |
            petition-stores-

      # Ohne Cache fällt der Lauf auf den im Repo liegenden Stand zurück. Beim
      # normalen Lauf ist das gewollt (danach wird ja gescrapt), bei "nur
      # veröffentlichen" wäre es ein RÜCKSCHRITT: die App bekäme den alten
      # Repo-Stand statt der aktuellen Zahlen. Deshalb hier abbrechen, bevor
      # irgendetwas ausgeliefert wird.
      - name: "Ohne Cache nicht veröffentlichen"
        if: ${{ inputs.nur_veroeffentlichen &&
                !steps.zustand.outputs.cache-matched-key }}
        run: |
          echo "::error::Kein Scraper-Zustand im Cache (Caches verfallen nach 7 Tagen)."
          echo "Ein reiner Veröffentlichungslauf würde den veralteten Repo-Stand"
          echo "ausliefern. Bitte einen vollen Lauf ohne diesen Haken starten."
          exit 1

      # Gemeinsame Frist für die beiden langen Schritte. Das Job-Limit liegt bei
      # 350 min; die letzten 50 min gehören fest publish.py und dem Pages-Deploy.
      # Vorher hatte jeder Schritt sein eigenes Budget – am 29.7.26 fraß das
      # Scrapen allein 289 min, das Change.org-Budget von 4 h kam nie zum Tragen,
      # der Job lief ins Job-Limit und wurde MITTEN im Lauf abgeschossen. Folge:
      # publish.py und der Pages-Deploy wurden übersprungen, der ganze Tag ohne
      # Veröffentlichung – obwohl das Scrapen erfolgreich war. Mit einer
      # gemeinsamen Frist teilen sich beide Schritte den Rest: ist das Scrapen
      # schnell (28.7.: 42 min), bleiben dem Aufholen über 4 h.
      - name: Zeitrahmen setzen
        run: echo "FRIST=$(( $(date +%s) + 300*60 ))" >> "$GITHUB_ENV"

      - name: Health-Check der Entdeckungsquellen (nicht blockierend)
        if: ${{ !inputs.nur_veroeffentlichen }}
        continue-on-error: true
        run: python3 monitor.py --check

      # Bewusst NICHT im Tageslauf, sondern nur über "Run workflow" mit dem
      # Haken "nacharbeit". Grund: der Tageslauf entdeckt beim Bundestag nur
      # die Mitzeichnungsfrist (status.2) und bei Avaaz nur die ~10 verlinkten
      # Petitionen. Die 7.845 beendeten Bundestags-Petitionen (status.3+4) und
      # die Archivfunde bei Avaaz kommen ausschließlich über --backfill bzw.
      # --archive. Ohne diesen Schritt zeigt die Live-App dauerhaft 64 statt
      # 7.903 Bundestags-Petitionen, obwohl die APK die lokal erzeugten 7.903
      # gebündelt mitbringt (am 30.7.26 gegen das Live-Manifest gemessen).
      # Einmal anfordern genügt: beide Aufrufe legen die Datensätze sofort an
      # und hinterlassen ihre Volltext-Warteschlange (backfill_todo bzw.
      # archive_todo) im _meta des Stores; die täglichen Läufe arbeiten sie
      # danach von allein in Portionen ab (300 bzw. 120 pro Lauf).
      - name: "Nacharbeit auf Anforderung (Bundestag-Phasen 3+4, Avaaz-Archiv)"
        if: ${{ inputs.nacharbeit && !inputs.nur_veroeffentlichen }}
        run: |
          # Höchstens 60 min je Aufruf: die Nacharbeit darf dem Tages-Scrape
          # und dem Deploy nicht das gemeinsame Zeitbudget wegnehmen.
          for aufruf in "--platform bundestag --backfill" "--platform avaaz --archive"; do
            rest=$(( FRIST - $(date +%s) ))
            if [ "$rest" -gt 3600 ]; then rest=3600; fi
            if [ "$rest" -lt 60 ]; then
              echo "::warning::Zeitrahmen erschöpft – Nacharbeit $aufruf übersprungen."
              continue
            fi
            set +e
            timeout --signal=INT "$rest" python3 monitor.py $aufruf --no-recheck
            code=$?
            set -e
            if [ $code -eq 124 ] || [ $code -eq 130 ]; then
              echo "::warning::Zeitrahmen bei der Nacharbeit erreicht ($aufruf) – Rest folgt beim nächsten Lauf."
            elif [ $code -ne 0 ]; then
              exit $code
            fi
          done

      - name: Scrapen (alle Live-Plattformen; überspringt <24 h Geprüftes)
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          rest=$(( FRIST - $(date +%s) ))
          # Bewusst als if: GitHub führt run-Blöcke mit "bash -e" aus, und
          # ein "[ … ] && x=1" mit falscher Bedingung liefert 1 – das würde
          # den Schritt an dieser Stelle abbrechen.
          if [ "$rest" -lt 60 ]; then rest=60; fi
          set +e
          # SIGINT statt SIGKILL: die Scraper schreiben ihren Zustand laufend
          # über eine temporäre Datei, ein sauberer Abbruch verliert nur den
          # angefangenen Block.
          timeout --signal=INT "$rest" python3 monitor.py
          code=$?
          set -e
          # 124/130 = Frist erreicht; alles andere ist ein echter Fehler und
          # muss den Lauf weiterhin rot färben.
          if [ $code -eq 124 ] || [ $code -eq 130 ]; then
            echo "::warning::Zeitrahmen beim Scrapen erreicht – Rest folgt beim nächsten Lauf."
          elif [ $code -ne 0 ]; then
            exit $code
          fi

      - name: "Change.org aufholen (500/Lauf, wiederholt bis zur gemeinsamen Frist)"
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          while ! python3 ci_changeorg_done.py; do
            if [ "$(date +%s)" -ge "$FRIST" ]; then
              echo "::warning::Zeitrahmen erreicht – Change.org-Rest folgt beim nächsten Lauf."
              break
            fi
            rest=$(( FRIST - $(date +%s) ))
            set +e
            timeout --signal=INT "$rest" python3 monitor.py --platform changeorg
            code=$?
            set -e
            if [ $code -eq 124 ] || [ $code -eq 130 ]; then
              echo "::warning::Zeitrahmen erreicht – Change.org-Rest folgt beim nächsten Lauf."
              break
            elif [ $code -ne 0 ]; then
              exit $code
            fi
          done

      - name: Web-App-Daten erzeugen
        run: python3 publish.py

      - name: Scraper-Zustand cachen
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            *_petitions.json
            texts_index.json
          key: petition-stores-${{ github.run_id }}

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: webapp/ als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: Auf GitHub Pages veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
