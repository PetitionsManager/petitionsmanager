name: Scrape & Publish

# Holt täglich frische Petitionsdaten und veröffentlicht sie über GitHub Pages.
# Der Scraper-Zustand (die *_petitions.json) lebt im Actions-Cache – so wächst
# das Repo NICHT mit jedem Lauf. Manuell startbar über "Run workflow".
on:
  # Zwei Läufe pro Tag (4.9.2026): seit das Verworfenen-Register wirkt, reißen
  # die Läufe die 300-min-Frist täglich (#50–#54 alle exakt 316 min) —
  # openpetition fiel am 4.9. ganz heraus, die Change.org-Aufholschleife bekam
  # nur noch ihre 15 Zuschlagsminuten. Der zweite Lauf verdoppelt das Fenster;
  # skip_recent (24 h) verhindert doppelte Nachprüfungen, seine Zeit fließt
  # also in Entdeckung und Aufholen. Läuft der erste Lauf noch (Cron startet
  # real bis zu Stunden später), stellt die concurrency-Gruppe den zweiten
  # hinten an statt ihn parallel loszulassen.
  schedule:
    - cron: '17 3 * * *'      # täglich 03:17 UTC
    - cron: '17 15 * * *'     # zweiter Lauf 15:17 UTC
  workflow_dispatch:
    inputs:
      nacharbeit:
        description: 'Einmalige Nacharbeit mitlaufen lassen (Bundestag-Phasen 3+4, Avaaz-Archiv)'
        type: boolean
        default: false
      # Veröffentlicht den zuletzt gescrapten Stand aus dem Cache neu, ohne
      # eine einzige Quelle anzufassen: ~3 statt ~300 Minuten. Gedacht für
      # Änderungen, die nur die Web-App oder publish.py betreffen — sonst
      # müsste man auf den Nachtlauf warten, um sie live zu sehen.
      nur_veroeffentlichen:
        description: 'Nur veröffentlichen (nicht scrapen) – letzten Stand aus dem Cache neu ausliefern'
        type: boolean
        default: false
      # Holt die fremdsprachigen Fassungen nach. Der Tageslauf lässt sie
      # bewusst aus (--keine-sprachen), weil sie die Detailabrufe verdoppeln.
      # Sieben der elf Plattformen veröffentlichen ihre Petitionen in mehr als
      # einer Sprache; ohne diesen Schritt bleibt die App in der englischen
      # Oberfläche bei deutschen Petitionstexten.
      sprachen:
        description: 'Übersetzungen nachholen (verdoppelt die Detailabrufe, eigener Schritt)'
        type: boolean
        default: false
      # Speist einen im REPO gepflegten Scraper-Zustand einmalig in den Cache
      # ein. Anlass (12.8.2026): europarl ist aus GitHubs Rechenzentrum heraus
      # nicht scrapebar – das EU-Parlament antwortet dort auf JEDE Adresse mit
      # einer AWS-WAF-Sperrseite (HTTP 202, 6 von 6 Abrufen gemessen). Der
      # Bestand fror deshalb auf einem alten Stand ein, samt 47 Zusammen-
      # fassungen aus der Zeit vor der Parser-Korrektur vom 3.8.2026.
      #
      # ⚠️ Ohne diesen Schalter nützt ein reparierter, committeter Store
      # NICHTS: der Schritt "Scraper-Zustand aus Cache holen" überschreibt
      # ALLE *_petitions.json mit den Fassungen aus dem Cache.
      #
      # Bewusst ein EINMALIGER Eingriff und keine Dauerregel: nach dem Lauf
      # trägt der Cache den reparierten Stand von allein weiter. Eine feste
      # Regel "Repo schlägt Cache" würde einen später doch erfolgreichen
      # CI-Scrape still überschreiben.
      store_aus_repo:
        description: 'Diese Scraper-Zustände aus dem Repo statt aus dem Cache nehmen (Plattform-Schlüssel, mit Komma getrennt, z. B. "europarl")'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scrape-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: "Scraper-Zustand aus Cache holen (Fallback: Stand im Repo)"
        id: zustand
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          # texts_index.json MUSS mitwandern: er hält fest, in welchem
          # Volltext-Paket eine Petition liegt. Geht er verloren, vergibt
          # publish.py die Nummern neu und jedes Gerät lädt alle Pakete
          # noch einmal (siehe publish.write_texts).
          path: |
            *_petitions.json
            texts_index.json
          key: petition-stores-${{ github.run_id }}
          restore-keys: |
            petition-stores-

      # ⚠️ MUSS nach dem Cache-Restore stehen – der überschreibt sonst genau
      # das, was hier eingespielt wird. Siehe die Begründung bei der Eingabe.
      - name: "Scraper-Zustand aus dem Repo einspeisen (einmalig, auf Anforderung)"
        if: ${{ inputs.store_aus_repo != '' }}
        env:
          SCHLUESSEL: ${{ inputs.store_aus_repo }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          def zaehle(pfad):
              """Datensätze im Store – die Zahl ist der Beleg, dass der
              Austausch gewirkt hat. Ein unlesbarer Store ergibt None statt 0:
              0 sähe aus wie ein leerer Bestand und wäre eine falsche Aussage."""
              try:
                  with open(pfad, encoding="utf-8") as f:
                      d = json.load(f)
                  return sum(1 for v in d.values()
                             if isinstance(v, dict) and v.get("slug"))
              except Exception:
                  return None

          keys = [k.strip() for k in os.environ["SCHLUESSEL"].split(",") if k.strip()]
          # Geprüft wird gegen den ECHTEN Bestand der versionierten Dateien,
          # nicht gegen ein selbstgebautes Namensmuster. Eine Allowlist verwirft
          # still, und ein Tippfehler sähe hinterher aus wie "hat nichts
          # gefunden" statt wie ein Fehler.
          bekannt = subprocess.run(["git", "ls-files", "*_petitions.json"],
                                   capture_output=True, text=True, check=True
                                   ).stdout.split()
          fehler = []
          for k in keys:
              ziel = f"{k}_petitions.json"
              if ziel not in bekannt:
                  fehler.append(f"{k!r} (im Repo gibt es {ziel} nicht)")
                  continue
              vorher = zaehle(ziel)
              subprocess.run(["git", "checkout", "HEAD", "--", ziel], check=True)
              nachher = zaehle(ziel)
              print(f"::warning title=Store aus Repo::{ziel}: aus dem Cache "
                    f"{vorher} Datensätze -> aus dem Repo {nachher} Datensätze.")
          if fehler:
              # Hart abbrechen: ein durchgewinkter Tippfehler hieße, der Lauf
              # veröffentlicht klaglos weiter den alten Stand.
              print("::error title=Store aus Repo::Unbekannte Schlüssel: "
                    + "; ".join(fehler) + ". Bekannt sind: "
                    + ", ".join(b.replace("_petitions.json", "") for b in bekannt))
              sys.exit(1)
          if not keys:
              print("::error title=Store aus Repo::Eingabe gesetzt, aber leer "
                    "ausgewertet – nichts eingespielt.")
              sys.exit(1)
          PY

      # Ohne Cache fällt der Lauf auf den im Repo liegenden Stand zurück. Beim
      # normalen Lauf ist das gewollt (danach wird ja gescrapt), bei "nur
      # veröffentlichen" wäre es ein RÜCKSCHRITT: die App bekäme den alten
      # Repo-Stand statt der aktuellen Zahlen. Deshalb hier abbrechen, bevor
      # irgendetwas ausgeliefert wird.
      - name: "Ohne Cache nicht veröffentlichen"
        if: ${{ inputs.nur_veroeffentlichen &&
                !steps.zustand.outputs.cache-matched-key }}
        run: |
          echo "::error::Kein Scraper-Zustand im Cache (Caches verfallen nach 7 Tagen)."
          echo "Ein reiner Veröffentlichungslauf würde den veralteten Repo-Stand"
          echo "ausliefern. Bitte einen vollen Lauf ohne diesen Haken starten."
          exit 1

      # Gemeinsame Frist für die beiden langen Schritte. Das Job-Limit liegt bei
      # 350 min; die letzten 50 min gehören fest publish.py und dem Pages-Deploy.
      # Vorher hatte jeder Schritt sein eigenes Budget – am 29.7.26 fraß das
      # Scrapen allein 289 min, das Change.org-Budget von 4 h kam nie zum Tragen,
      # der Job lief ins Job-Limit und wurde MITTEN im Lauf abgeschossen. Folge:
      # publish.py und der Pages-Deploy wurden übersprungen, der ganze Tag ohne
      # Veröffentlichung – obwohl das Scrapen erfolgreich war. Mit einer
      # gemeinsamen Frist teilen sich beide Schritte den Rest: ist das Scrapen
      # schnell (28.7.: 42 min), bleiben dem Aufholen über 4 h.
      - name: Zeitrahmen setzen
        run: echo "FRIST=$(( $(date +%s) + 300*60 ))" >> "$GITHUB_ENV"

      - name: Health-Check der Entdeckungsquellen (nicht blockierend)
        if: ${{ !inputs.nur_veroeffentlichen }}
        continue-on-error: true
        run: python3 monitor.py --check

      # Bewusst NICHT im Tageslauf, sondern nur über "Run workflow" mit dem
      # Haken "nacharbeit". Grund: der Tageslauf entdeckt beim Bundestag nur
      # die Mitzeichnungsfrist (status.2) und bei Avaaz nur die ~10 verlinkten
      # Petitionen. Die 7.845 beendeten Bundestags-Petitionen (status.3+4) und
      # die Archivfunde bei Avaaz kommen ausschließlich über --backfill bzw.
      # --archive. Ohne diesen Schritt zeigt die Live-App dauerhaft 64 statt
      # 7.903 Bundestags-Petitionen, obwohl die APK die lokal erzeugten 7.903
      # gebündelt mitbringt (am 30.7.26 gegen das Live-Manifest gemessen).
      # Einmal anfordern genügt: beide Aufrufe legen die Datensätze sofort an
      # und hinterlassen ihre Volltext-Warteschlange (backfill_todo bzw.
      # archive_todo) im _meta des Stores; die täglichen Läufe arbeiten sie
      # danach von allein in Portionen ab (300 bzw. 120 pro Lauf).
      - name: "Nacharbeit auf Anforderung (Bundestag-Phasen 3+4, Avaaz-Archiv)"
        if: ${{ inputs.nacharbeit && !inputs.nur_veroeffentlichen }}
        run: |
          # Höchstens 60 min je Aufruf: die Nacharbeit darf dem Tages-Scrape
          # und dem Deploy nicht das gemeinsame Zeitbudget wegnehmen.
          for aufruf in "--platform bundestag --backfill" "--platform avaaz --archive"; do
            rest=$(( FRIST - $(date +%s) ))
            if [ "$rest" -gt 3600 ]; then rest=3600; fi
            if [ "$rest" -lt 60 ]; then
              echo "::warning::Zeitrahmen erschöpft – Nacharbeit $aufruf übersprungen."
              continue
            fi
            set +e
            timeout --signal=INT "$rest" python3 monitor.py $aufruf --no-recheck
            code=$?
            set -e
            if [ $code -eq 124 ] || [ $code -eq 130 ]; then
              echo "::warning::Zeitrahmen bei der Nacharbeit erreicht ($aufruf) – Rest folgt beim nächsten Lauf."
            elif [ $code -ne 0 ]; then
              exit $code
            fi
          done

      - name: Scrapen (alle Live-Plattformen; überspringt <24 h Geprüftes)
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          rest=$(( FRIST - $(date +%s) ))
          # Bewusst als if: GitHub führt run-Blöcke mit "bash -e" aus, und
          # ein "[ … ] && x=1" mit falscher Bedingung liefert 1 – das würde
          # den Schritt an dieser Stelle abbrechen.
          if [ "$rest" -lt 60 ]; then rest=60; fi
          set +e
          # SIGINT statt SIGKILL: die Scraper schreiben ihren Zustand laufend
          # über eine temporäre Datei, ein sauberer Abbruch verliert nur den
          # angefangenen Block.
          # --keine-sprachen: die fremdsprachigen Fassungen VERDOPPELN die
          # Detailabrufe (~1.800 zusätzliche, Avaaz allein ~1.186). Der
          # Tageslauf schöpft sein Budget schon heute nicht immer aus — die
          # Frische der Plattformen ist gestaffelt. Ungefragt dazugenommen
          # fielen hinten Plattformen heraus, ohne dass jemand einen Fehler
          # sähe. Die Übersetzungen holt der eigene Schritt unten.
          timeout --signal=INT "$rest" python3 monitor.py --keine-sprachen
          code=$?
          set -e
          # 124/130 = Frist erreicht; alles andere ist ein echter Fehler und
          # muss den Lauf weiterhin rot färben.
          if [ $code -eq 124 ] || [ $code -eq 130 ]; then
            echo "::warning::Zeitrahmen beim Scrapen erreicht – Rest folgt beim nächsten Lauf."
          elif [ $code -ne 0 ]; then
            exit $code
          fi

      # Haken "sprachen". Sieben Plattformen veröffentlichen ihre Petitionen in
      # mehr als einer Sprache (am 8.8.2026 alle elf mit echtem Abruf gemessen).
      # Der Tageslauf lässt sie aus, weil sie die Detailabrufe verdoppeln; hier
      # werden sie nachgeholt. Je Plattform ein eigener Aufruf mit --force,
      # sonst überspringt skip_recent genau die Sätze, die der Tageslauf gerade
      # ohne Übersetzung angefasst hat.
      #
      # ⚠️ Reihenfolge ist Absicht: die billigen zuerst. Europarl kostet KEINEN
      # Zusatzabruf (es holt die deutsche statt der englischen Seite),
      # openpetition/threefifty/foodwatch lesen den Sprachhinweis aus dem HTML,
      # das sie ohnehin holen. Avaaz steht hinten — allein ~1.186 Abrufe. Reißt
      # die Frist, fehlt so das Billigste zuletzt und nicht zuerst.
      #
      # ⚠️ Ekō fehlt bewusst: dort gibt es keinen Weg zur Übersetzung (kein
      # Sprachsegment, kein Umschalter, kein Index), nur die campaign_id als
      # Klammer. Ein Aufruf brächte nichts als Last.
      - name: "Übersetzungen nachholen (auf Anforderung)"
        if: ${{ inputs.sprachen && !inputs.nur_veroeffentlichen }}
        run: |
          for plat in europarl openpetition threefifty foodwatch wemove avaaz; do
            rest=$(( FRIST - $(date +%s) ))
            if [ "$rest" -gt 3600 ]; then rest=3600; fi
            if [ "$rest" -lt 60 ]; then
              echo "::warning::Zeitrahmen erschöpft – Übersetzungen für $plat übersprungen."
              continue
            fi
            set +e
            timeout --signal=INT "$rest" python3 monitor.py --platform "$plat" --force
            code=$?
            set -e
            if [ $code -eq 124 ] || [ $code -eq 130 ]; then
              echo "::warning::Zeitrahmen bei den Übersetzungen erreicht ($plat) – Rest folgt beim nächsten Anfordern."
            elif [ $code -ne 0 ]; then
              exit $code
            fi
          done

      - name: "Change.org aufholen (500/Lauf, eigener Zuschlag über die Frist hinaus)"
        if: ${{ !inputs.nur_veroeffentlichen }}
        run: |
          # ⚠️ Eigener Zuschlag von 15 min ÜBER die gemeinsame FRIST (24.8.2026):
          # vorher hing die Schleife an derselben FRIST, die der Sammellauf am
          # 23./24.8. bereits restlos aufgebraucht hatte – der Schritt lief dann
          # 0 Sekunden, genau wenn das Aufholen gebraucht wurde. 315 min plus
          # Veröffentlichen bleiben unter timeout-minutes: 350.
          AUFHOL=$(( FRIST + 15*60 ))
          while ! python3 ci_changeorg_done.py; do
            if [ "$(date +%s)" -ge "$AUFHOL" ]; then
              echo "::warning::Zeitrahmen erreicht – Change.org-Rest folgt beim nächsten Lauf."
              break
            fi
            rest=$(( AUFHOL - $(date +%s) ))
            set +e
            timeout --signal=INT "$rest" python3 monitor.py --platform changeorg
            code=$?
            set -e
            if [ $code -eq 124 ] || [ $code -eq 130 ]; then
              echo "::warning::Zeitrahmen erreicht – Change.org-Rest folgt beim nächsten Lauf."
              break
            elif [ $code -ne 0 ]; then
              exit $code
            fi
          done

      - name: Web-App-Daten erzeugen
        run: python3 publish.py

      - name: Scraper-Zustand cachen
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            *_petitions.json
            texts_index.json
          key: petition-stores-${{ github.run_id }}

      - name: Pages konfigurieren
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - name: webapp/ als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: webapp

      - name: Auf GitHub Pages veröffentlichen
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
